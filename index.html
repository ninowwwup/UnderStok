<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>UnderStok — Consulta & Inteligência Logística (CD Extrema MG)</title>
  <meta name="description" content="Sistema interativo de consulta, gestão, movimentação e aprendizado rápido de Centros e Depósitos Logísticos (CD Extrema MG) integrado ao Google Planilhas." />
  <meta name="theme-color" content="#0ea5e9" />

  <!-- PWA Android & iOS Meta Tags -->
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/svg+xml" href="./assets/icon.svg" />
  <link rel="apple-touch-icon" href="./assets/icon.svg" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="UnderStok" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;700;800&display=swap" rel="stylesheet" />

  <!-- Stylesheet -->
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
  <!-- TOP COMMAND BAR -->
  <header class="top-navbar">
    <div class="navbar-inner">
      <div class="brand-group" style="cursor:pointer;" onclick="switchTab('dashboard')">
        <div class="brand-logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
            <polyline points="3.27 6.96 12 12.01 20.73 6.96"/>
            <line x1="12" y1="22.08" x2="12" y2="12"/>
          </svg>
        </div>
        <div class="brand-titles">
          <h1>
            <span class="brand-gradient-text">UnderStok</span>
            <span class="badge-unit">CD Extrema MG</span>
          </h1>
          <div class="brand-subtitle">Arquitetura Logística, Consulta Inteligente & Treinamento de Equipe</div>
        </div>
      </div>

      <div class="navbar-actions">
        <div id="syncStatusPill" class="sync-pill local-mode" onclick="switchTab('cloud')" title="Configurar sincronização com Google Planilhas">
          <span class="sync-dot"></span>
          <span>Google Sheets</span>
        </div>

        <button class="btn btn-sm btn-secondary" onclick="triggerPwaInstall()" id="pwaInstallBtn" title="Instalar aplicativo no Android, iOS ou Desktop">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Instalar App
        </button>

        <button class="btn btn-sm btn-secondary" id="themeToggleBtn" onclick="toggleTheme()" title="Alternar tema Claro / Escuro"></button>
      </div>
    </div>
  </header>

  <!-- DESKTOP NAVIGATION TABS -->
  <nav class="nav-tabs-bar" aria-label="Navegação Principal">
    <div class="nav-tabs-list">
      <button class="nav-tab-btn active" data-tab="dashboard" onclick="switchTab('dashboard')">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        Consulta & Matriz Geral
      </button>

      <button class="nav-tab-btn" data-tab="centros" onclick="switchTab('centros')">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        Centros CD
        <span class="nav-tab-count" id="navCountCentros">7</span>
      </button>

      <button class="nav-tab-btn" data-tab="depositos" onclick="switchTab('depositos')">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>
        Depósitos & Kanban
        <span class="nav-tab-count" id="navCountDepositos">21</span>
      </button>

      <button class="nav-tab-btn" data-tab="fluxos" onclick="switchTab('fluxos')">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
        Fluxos & Movimentação
      </button>

      <button class="nav-tab-btn" data-tab="academia" onclick="switchTab('academia')">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>
        Academia & Quiz
      </button>

      <button class="nav-tab-btn" data-tab="cloud" onclick="switchTab('cloud')">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/></svg>
        Planilha Google & Log
      </button>
    </div>
  </nav>

  <!-- MAIN DYNAMIC WORKSPACE -->
  <main id="appMainContainer" class="main-container"></main>

  <!-- MOBILE STICKY BOTTOM BAR (ANDROID & IOS) -->
  <nav class="mobile-bottom-nav" aria-label="Navegação Mobile">
    <button class="mobile-nav-item active" data-tab="dashboard" onclick="switchTab('dashboard')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <span>Consulta</span>
    </button>
    <button class="mobile-nav-item" data-tab="centros" onclick="switchTab('centros')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      <span>Centros</span>
    </button>
    <button class="mobile-nav-item" data-tab="depositos" onclick="switchTab('depositos')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>
      <span>Depósitos</span>
    </button>
    <button class="mobile-nav-item" data-tab="fluxos" onclick="switchTab('fluxos')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/></svg>
      <span>Mover</span>
    </button>
    <button class="mobile-nav-item" data-tab="academia" onclick="switchTab('academia')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>
      <span>Aprender</span>
    </button>
    <button class="mobile-nav-item" data-tab="cloud" onclick="switchTab('cloud')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/></svg>
      <span>Planilha</span>
    </button>
  </nav>

  <!-- GLOBAL MODAL -->
  <div id="globalModalBackdrop" class="modal-backdrop" onclick="if(event.target === this) closeModal()">
    <div id="globalModalWindow" class="modal-window"></div>
  </div>

  <!-- TOAST NOTIFICATIONS -->
  <div id="toastContainer" class="toast-container"></div>

  <!-- SCRIPTS -->
  <script src="./js/data.js"></script>
  <script src="./js/api.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
